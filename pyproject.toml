[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "trainbase"
version = "0.1.0"
description = "Markdown-first interactive courses for Colab and Jupyter."
readme = "README.md"
requires-python = ">=3.9"
authors = [
  { name = "Nguyen Tuan Hiep" }
]
license = { text = "MIT" }
dependencies = [
  "requests>=2.31.0",
  "pyyaml>=6.0.1",
  "ipywidgets>=8.0.0"
]

[project.urls]
Homepage = "https://github.com/YOUR_USERNAME/trainbase"
Repository = "https://github.com/YOUR_USERNAME/trainbase"

[tool.setuptools.packages.find]
where = ["src"]
